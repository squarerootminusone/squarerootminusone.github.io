<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 500" width="510" height="500" role="img" aria-labelledby="t d">
<title id="t">beepboop3000 signal path</title>
<desc id="d">Lidar, camera and IMU feed a Raspberry Pi 3B running ROS 2; its GPIO pins drive two L298N H-bridges, which drive four motors.</desc>
<style>
  .s   { fill: none; stroke: #111111; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .f   { fill: #111111; }
  .lbl { font-family: Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 700; text-anchor: middle; fill: #111111; }
  .tag { font-family: Helvetica, Arial, sans-serif; font-size: 28px; text-anchor: middle; fill: #666666; }
</style>

<rect width="510" height="500" fill="#ffffff"/>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
  </marker>
</defs>

<!-- lidar -->
<circle class="s" cx="78" cy="64" r="32"/>
<circle class="f" cx="78" cy="64" r="10"/>
<path class="s" d="M118,40 L144,28 M118,64 L148,64 M118,88 L144,100"/>

<!-- camera -->
<rect class="s" x="215" y="34" width="82" height="58" rx="6"/>
<circle class="s" cx="256" cy="63" r="17"/>

<!-- imu -->
<rect class="s" x="368" y="34" width="60" height="60" rx="5"/>
<path class="s" d="M398,66 V44 M398,66 H422 M398,66 L381,82"/>

<path class="s" d="M255,118 V150" marker-end="url(#a)"/>

<!-- raspberry pi -->
<rect class="s" x="105" y="156" width="300" height="98" rx="7"/>
<rect class="s" x="130" y="184" width="66" height="58" rx="4"/>
<path class="s" d="M130,172 H196"/>
<text class="lbl" x="305" y="220">PI 3B</text>

<path class="s" d="M255,262 V296" marker-end="url(#a)"/>
<text class="tag" x="310" y="286">GPIO</text>

<!-- h-bridges -->
<rect class="s" x="95" y="302" width="150" height="78" rx="6"/>
<text class="lbl" x="170" y="357">H</text>
<rect class="s" x="265" y="302" width="150" height="78" rx="6"/>
<text class="lbl" x="340" y="357">H</text>

<path class="s" d="M255,388 V420" marker-end="url(#a)"/>
<text class="tag" x="310" y="410">PWM</text>

<!-- motors -->
<circle class="s" cx="105" cy="458" r="32"/>
<text class="lbl" x="105" y="473">M</text>
<circle class="s" cx="205" cy="458" r="32"/>
<text class="lbl" x="205" y="473">M</text>
<circle class="s" cx="305" cy="458" r="32"/>
<text class="lbl" x="305" y="473">M</text>
<circle class="s" cx="405" cy="458" r="32"/>
<text class="lbl" x="405" y="473">M</text>
</svg>
