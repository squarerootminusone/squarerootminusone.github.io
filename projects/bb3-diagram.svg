<rect class="part" x="200" y="240" width="230" height="66"/>
<text class="ttl" x="315" y="260" text-anchor="middle">bb3 NODE</text>
<text class="note" x="315" y="275" text-anchor="middle">Vehicle : rclcpp::Node</text>
<text class="note" x="315" y="288" text-anchor="middle">Twist → clamp [−1,1] → mix → 4 × PWM</text>
<text class="note" x="315" y="300" text-anchor="middle">a turn slows the inner pair</text>

