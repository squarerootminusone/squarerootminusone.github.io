<!-- ══ NOTES ════════════════════════════════════════════════ -->
<line class="thin" x1="34" y1="800" x2="686" y2="800"/>
<text class="cap" x="34" y="820">ONE PACK PER BRIDGE. EACH BRIDGE CHANNEL TAKES TWO DIRECTION PINS AND ONE PWM ENABLE; Motor::set() WRITES DUTY 0–255.</text>
<text class="cap" x="34" y="836">SENSOR BLOCKS ARE ON THE PLATFORM BUT HAVE NO DRIVER IN THE bb3 ROS PACKAGE — IT IMPLEMENTS THE TWIST → MOTOR PATH ONLY.</text>
<text class="cap" x="34" y="856">PIN NUMBERS AND MIXING TAKEN FROM main.cpp, Vehicle.h AND Motor.h. INTERFACES (USB, CSI, I2C) ARE THOSE OF THE PARTS LISTED IN THE README.</text>
<text class="cap" x="34" y="876">PLANNED: JETSON NANO · 80 mm MECANUM WHEELS · 775 MOTORS · 4S LiPo · 4-CHANNEL BRIDGE · CUSTOM CHASSIS.</text>
</svg>
