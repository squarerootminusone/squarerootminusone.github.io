<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 500" width="790" height="500" role="img" aria-labelledby="t d">
<title id="t">beepboop3000 signal path</title>
<desc id="d">Schematic of the bb3 rover: four sensors on USB, CSI, I2C and GPIO feed a Raspberry Pi 3B running ROS 2 Foxy, which mixes a Twist on /cmd_vel into duty cycles and drives two L298N dual H-bridges over twelve GPIO pins; each bridge drives two TT DC motors from a 9.6 volt AA pack.</desc>
<style>
  .s    { fill: none; stroke: #111111; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #111111; stroke-width: 1.8; }
  .box  { fill: #ffffff; stroke: #111111; stroke-width: 2.6; }
  .f    { fill: #111111; }
  .h    { font-family: Helvetica, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #111111; }
  .n    { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #555555; }
  .p    { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; fill: #111111; }
  .t    { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #666666; }
  .c    { text-anchor: middle; }
</style>

<rect width="790" height="500" fill="#ffffff"/>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
  </marker>
</defs>

<!-- ── sensors ───────────────────────────────────────────── -->
<text class="t" x="18" y="18">SENSING</text>

<rect class="box" x="18" y="26" width="176" height="58" rx="3"/>
<text class="h" x="30" y="52">YDLIDAR X4</text>
<text class="n" x="30" y="72">USB · 5 Hz · 10 m</text>

<rect class="box" x="18" y="94" width="176" height="58" rx="3"/>
<text class="h" x="30" y="120">PI HQ CAMERA</text>
<text class="n" x="30" y="140">CSI-2 · 6 mm lens</text>

<rect class="box" x="18" y="162" width="176" height="58" rx="3"/>
<text class="h" x="30" y="188">MPU9250</text>
<text class="n" x="30" y="208">I²C · 9-DOF</text>

<rect class="box" x="18" y="230" width="176" height="58" rx="3"/>
<text class="h" x="30" y="256">HC-SR04</text>
<text class="n" x="30" y="276">GPIO · echo / trig</text>

<path class="thin" d="M194,55 H236" marker-end="url(#a)"/>
<path class="thin" d="M194,123 H236" marker-end="url(#a)"/>
<path class="thin" d="M194,191 H236" marker-end="url(#a)"/>
<path class="thin" d="M194,259 H236" marker-end="url(#a)"/>

<!-- ── compute ───────────────────────────────────────────── -->
<text class="t" x="240" y="18">COMPUTE</text>

<rect class="box" x="240" y="26" width="212" height="262" rx="3"/>
<text class="h" x="252" y="52">RASPBERRY PI 3B</text>
<text class="n" x="252" y="72">ROS 2 FOXY · pigpiod</text>

<rect class="thin" x="256" y="88" width="180" height="60" rx="2"/>
<text class="p" x="268" y="112">/cmd_vel</text>
<text class="t" x="268" y="132">geometry_msgs/Twist</text>

<rect class="thin" x="256" y="160" width="180" height="60" rx="2"/>
<text class="p" x="268" y="184">Vehicle::mix()</text>
<text class="t" x="268" y="204">v, ω → 4 × duty</text>

<text class="t" x="252" y="248">12 × GPIO → BCM</text>
<text class="t" x="252" y="270">5 V rail · 2.5 A</text>

<path class="thin" d="M452,110 H498" marker-end="url(#a)"/>
<path class="thin" d="M452,340 H498" marker-end="url(#a)"/>
<text class="t" x="456" y="102">6 pins</text>
<text class="t" x="456" y="332">6 pins</text>

<!-- ── drive ─────────────────────────────────────────────── -->
<text class="t" x="502" y="18">ACTUATION</text>

<rect class="box" x="502" y="26" width="184" height="176" rx="3"/>
<text class="h" x="514" y="52">L298N · LEFT</text>
<text class="n" x="514" y="72">dual H-bridge · Vs 9.6 V</text>
<path class="thin" d="M514,84 H674"/>
<text class="p" x="514" y="106">ENA 26</text><text class="p" x="568" y="106">IN1 19</text><text class="p" x="622" y="106">IN2 13</text>
<text class="p" x="514" y="128">ENB 11</text><text class="p" x="568" y="128">IN3  6</text><text class="p" x="622" y="128">IN4  5</text>
<path class="thin" d="M514,142 H674"/>
<text class="t" x="514" y="162">OUT1/2 → front left</text>
<text class="t" x="514" y="182">OUT3/4 → rear left</text>

<rect class="box" x="502" y="256" width="184" height="176" rx="3"/>
<text class="h" x="514" y="282">L298N · RIGHT</text>
<text class="n" x="514" y="302">dual H-bridge · Vs 9.6 V</text>
<path class="thin" d="M514,314 H674"/>
<text class="p" x="514" y="336">ENA 21</text><text class="p" x="568" y="336">IN1 20</text><text class="p" x="622" y="336">IN2 16</text>
<text class="p" x="514" y="358">ENB 25</text><text class="p" x="568" y="358">IN3 12</text><text class="p" x="622" y="358">IN4  7</text>
<path class="thin" d="M514,372 H674"/>
<text class="t" x="514" y="392">OUT1/2 → front right</text>
<text class="t" x="514" y="412">OUT3/4 → rear right</text>

<!-- ── motors ────────────────────────────────────────────── -->
<path class="thin" d="M686,78 H726" marker-end="url(#a)"/>
<path class="thin" d="M686,150 H726" marker-end="url(#a)"/>
<path class="thin" d="M686,308 H726" marker-end="url(#a)"/>
<path class="thin" d="M686,380 H726" marker-end="url(#a)"/>

<circle class="box" cx="752" cy="78" r="26"/>
<text class="h c" x="752" y="86">M</text>
<circle class="box" cx="752" cy="150" r="26"/>
<text class="h c" x="752" y="158">M</text>
<circle class="box" cx="752" cy="308" r="26"/>
<text class="h c" x="752" y="316">M</text>
<circle class="box" cx="752" cy="380" r="26"/>
<text class="h c" x="752" y="388">M</text>
<text class="t c" x="752" y="424">4 × TT DC</text>
<text class="t c" x="752" y="442">65 mm</text>

<!-- ── power ─────────────────────────────────────────────── -->
<text class="t" x="18" y="330">POWER</text>

<rect class="box" x="18" y="338" width="176" height="88" rx="3"/>
<path class="thin" d="M34,376 H150 M34,362 V390 M56,368 V384 M78,362 V390 M100,368 V384"/>
<text class="h" x="30" y="410">16 × AA NiMH</text>
<text class="n" x="30" y="356">9.6 V · 1900 mAh</text>

<path class="thin" d="M106,426 V452 M84,452 H128 M92,462 H120 M100,472 H112"/>

<text class="t" x="240" y="470">2 × 8-cell packs, one per bridge; the Pi runs off a separate 5 V regulator.</text>
</svg>
