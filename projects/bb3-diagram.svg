<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-labelledby="t d">
<title id="t">beepboop3000 (bb3) wiring schematic</title>
<desc id="d">Schematic of the bb3 rover. Four sensors feed a Raspberry Pi 3B over USB, CSI, I2C and GPIO. The Pi's GPIO pins drive two L298N dual H-bridges, each with enable and direction inputs, and each bridge drives two TT DC motors. Two eight-cell NiMH packs supply the bridges, one per side. Twist commands arrive over Wi-Fi.</desc>

<style>
  .w    { stroke:#1a1a1a; stroke-width:1; fill:none; }
  .thin { stroke:#1a1a1a; stroke-width:.8; fill:none; }
  .encl { stroke:#1a1a1a; stroke-width:1; fill:none; stroke-dasharray:5 3; }
  .part { stroke:#1a1a1a; stroke-width:1; fill:#ffffff; }
  .lab  { font:8.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1a1a1a; letter-spacing:.06em; }
  .pin  { font:7.5px ui-monospace,Menlo,Consolas,monospace; fill:#1a1a1a; }
  .ttl  { font:600 9.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#1a1a1a; letter-spacing:.09em; }
  .note { font:8px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#5a5a5a; letter-spacing:.03em; }
  .cap  { font:8.5px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; fill:#6a6a6a; }
</style>

