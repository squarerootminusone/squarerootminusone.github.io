<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 486" width="400" height="486" role="img" aria-labelledby="t d">
<title id="t">beepboop3000 signal path</title>
<desc id="d">Sensors feed a Raspberry Pi 3B running ROS 2. Its GPIO pins drive two L298N H-bridges, which drive four DC motors from an eight-cell AA pack.</desc>
<style>
  .box  { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
  .lbl  { font-family: Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 600; text-anchor: middle; fill: #111111; }
  .sub  { font-family: Helvetica, Arial, sans-serif; font-size: 23px; text-anchor: middle; fill: #555555; }
  .tag  { font-family: Helvetica, Arial, sans-serif; font-size: 21px; fill: #555555; }
  .wire { stroke: #111111; stroke-width: 2.5; fill: none; }
</style>

<rect width="400" height="486" fill="#ffffff"/>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
  </marker>
</defs>

<rect class="box" x="40" y="14" width="320" height="88" rx="3"/>
<text class="lbl" x="200" y="50">SENSORS</text>
<text class="sub" x="200" y="80">LIDAR · CAM · IMU</text>

<path class="wire" d="M200,102 V126" marker-end="url(#ar)"/>

<rect class="box" x="40" y="134" width="320" height="88" rx="3"/>
<text class="lbl" x="200" y="170">RASPBERRY PI 3B</text>
<text class="sub" x="200" y="200">ROS 2 · cmd_vel</text>

<path class="wire" d="M200,222 V254" marker-end="url(#ar)"/>
<text class="tag" x="212" y="245">12 × GPIO</text>

<rect class="box" x="40" y="262" width="320" height="88" rx="3"/>
<text class="lbl" x="200" y="298">2 × L298N</text>
<text class="sub" x="200" y="328">DUAL H-BRIDGE</text>

<path class="wire" d="M200,350 V382" marker-end="url(#ar)"/>
<text class="tag" x="212" y="373">PWM</text>

<rect class="box" x="40" y="390" width="320" height="88" rx="3"/>
<text class="lbl" x="200" y="426">4 × TT MOTOR</text>
<text class="sub" x="200" y="456">TT DC · 65 mm</text>
</svg>
